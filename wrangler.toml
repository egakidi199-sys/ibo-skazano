name = "ibo-skazano"
compatibility_date = "2026-09-26"
pages_build_output_dir = "dist"

[vars]
LLM_PROVIDER = "groq"
GEMINI_MODEL = "gemini-flash-latest"
GROQ_MODEL = "openai/gpt-oss-120b"

# KV для рейт-лимита (namespace «ibo-skazano-rate-limit»; id не секрет).
# Без привязки лимитер работает fail-open.
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "d3f56c2ddc1347e28ebaa2d797976d65"
