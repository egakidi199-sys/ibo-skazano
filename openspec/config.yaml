schema: spec-driven

context: |
  Language: ru
  All artifacts must be written in ru.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Проект: «Ибо сказано» (ibo-skazano) — веб-приложение: пользователь описывает
  ситуацию и тезис, выбирает «Подтвердить / Опровергнуть / Обе стороны» и получает
  подходящую цитату из Священного Писания с точной ссылкой и коротким пояснением.
  Корпус: Ветхий Завет (39 канонических книг) + четыре Евангелия (Мф, Мк, Лк, Ин),
  Синодальный перевод (общественное достояние). Остальные книги НЗ и неканонические
  книги ВЗ — вне корпуса.
  Главный инвариант: текст цитаты НИКОГДА не генерирует LLM. Модель возвращает только
  ссылки (книга, глава, стихи) и пояснение; сервер подставляет дословный текст из
  встроенного корпуса и отбрасывает ссылки, которых в корпусе нет.
  Тон: серьёзный, нейтральный, уважительный к тексту; без иронии и насмешки.
  Прообраз архитектуры — соседний проект C:\Claude\AstroStrikeBack (не трогаем его):
  Vite + React + TypeScript + Tailwind, Cloudflare Pages Function как прокси к LLM,
  абстракция провайдера (Groq по умолчанию, Gemini/OpenRouter переключаются env),
  Zod-валидация, рейт-лимит в KV, общий код в src/shared/ с относительными импортами,
  единственная реализация fallback (поиск по ключевым словам + тематический индекс),
  открытка PNG через html-to-image, ручной деплой через wrangler.
  Язык интерфейса и артефактов — русский.

rules:
  proposal:
    - Секция "Impact" всегда явно перечисляет non-goals MVP
  design:
    - Любое решение, касающееся текста Писания, проверять на инвариант «цитата только из корпуса»
  tasks:
    - Разбивать на пункты не крупнее половины дня работы
